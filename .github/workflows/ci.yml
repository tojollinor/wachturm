name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Python checks
        run: python -m unittest discover -s tests
      - name: JavaScript checks
        run: node --test tests/sensor-picker.test.cjs
      - name: Compile integration
        run: python -m compileall -q custom_components/ha_alarmzentrale
      - name: Install browser checks
        run: |
          python -m pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium
      - name: Browser checks
        run: |
          mkdir -p qa
          python tools/check_ui.py
          python tools/check_revision6_ui.py
          python tools/check_revision9_ui.py
